# Shared across all three members. Hardware-dependent fields (variant,
# resolution, batch, accum, amp_dtype, workers) are resolved at runtime by
# civicscan/autoconfig.py from the detected GPU — do not set them here.

seed: 42

# Paths — EDIT THESE to match your machine.
