val_json: "C:/Users/sreep/OneDrive/Desktop/NNDL-CivicScan/civicscan-model/data_pipeline/output/splits/val.json"
test_json: "C:/Users/sreep/OneDrive/Desktop/NNDL-CivicScan/civicscan-model/data_pipeline/output/splits/test.json"
image_root: "C:/Users/sreep/Downloads/civicscan_images"
class_weights: "C:/Users/sreep/OneDrive/Desktop/NNDL-CivicScan/civicscan-model/data_pipeline/output/class_weights.json"

use_class_weights: true
ema: true
ema_decay: 0.9998
clip_grad: 0.1
warmup_epochs: 3
